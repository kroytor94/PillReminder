name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app
      
      - name: Build app
        run: |
          xcodebuild -project PillReminder.xcodeproj -scheme PillReminder -sdk iphoneos -configuration Release build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      
      - name: Create .ipa
        run: |
          mkdir Payload
          cp -r build/Release-iphoneos/PillReminder.app Payload/
          zip -r PillReminder.ipa Payload
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillReminder
          path: PillReminder.ipa
